[package]
name = "swfasm-cli"
description = "A command line tool that compiles a textual representation into SWF files"
readme = "../README.md"
categories = ["command-line-utilities", "compilers"]
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "swfasm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.1", features = ["derive"] }
same-file = "1.0.6"
swfasm = { path = "..", version = "0.1.0", features = ["asc-vendored", "fs"] }
