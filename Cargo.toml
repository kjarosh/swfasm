[workspace]
members = ["cli"]
default-members = [".", "cli"]

[workspace.package]
authors = ["Kamil Jarosz <kjarosh256@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/kjarosh/swfasm"
version = "0.0.0"

[package]
name = "swfasm"
description = "A compiler that turns a textual representation into SWF files"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0"
ron = "0.12.2"
serde = { version = "1.0.228", features = ["derive"] }
swf = { git = "https://github.com/ruffle-rs/ruffle", rev = "49f93212b281f784de317aea9abd430e18345e21" }

[features]
# Utilities for reading files from the file system. Without it, the library
# doesn't use paths at all.
fs = []

[dev-dependencies]
libtest-mimic = "0.8.2"
walkdir = "2.5.0"

[[test]]
name = "examples"
harness = false
# The examples are compiled like swfasm-cli does, with files read by `Directory`.
required-features = ["fs"]
